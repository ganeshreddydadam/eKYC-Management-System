<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Admin Dashboard</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f7fb;
        }

        .header {
            background: #071e3d;
            color: white;
            padding: 20px;
            text-align: center;
        }

        .container {
            width: 90%;
            margin: 30px auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        h2 {
            color: #071e3d;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th {
            background: #071e3d;
            color: white;
            padding: 12px;
        }

        td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        .pending {
            color: #e67e22;
            font-weight: bold;
        }

        .view-btn {
            background: #1261a0;
            color: white;
            padding: 8px 15px;
            text-decoration: none;
            border-radius: 5px;
        }

        .view-btn:hover {
            background: #071e3d;
        }

        .empty {
            text-align: center;
            padding: 30px;
            color: #777;
        }
    </style>
</head>

<body>

<div class="header">
    <h1>Admin Dashboard</h1>
    <p>KYC Request Verification</p>
</div>

<div class="container">

    <h2>Pending KYC Requests</h2>

    <table th:if="${not #lists.isEmpty(pendingRequests)}">

        <thead>
        <tr>
            <th>Request ID</th>
            <th>Customer ID</th>
            <th>Request Type</th>
            <th>Message</th>
            <th>Status</th>
            <th>Action</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="request : ${pendingRequests}">

            <td th:text="${request.id}"></td>

            <td th:text="${request.customerId}"></td>

            <td th:text="${request.requestType}"></td>

            <td th:text="${request.message}"></td>

            <td class="pending"
                th:text="${request.status}">
            </td>

            <td>
                <a class="view-btn"
                   th:href="@{/admin/request/{id}(id=${request.id})}">
                    VIEW
                </a>
            </td>

        </tr>

        </tbody>

    </table>

    <div class="empty"
         th:if="${#lists.isEmpty(pendingRequests)}">

        <h3>No Pending Requests</h3>
        <p>There are currently no customer requests waiting for verification.</p>

    </div>

</div>

</body>
</html>
