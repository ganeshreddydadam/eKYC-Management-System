spring.datasource.url=jdbc:mysql://localhost:3306/ekyc_management
spring.datasource.username=root
spring.datasource.password=Root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.thymeleaf.cache=false

server.port=8080


# =====================================================
# SMTP EMAIL CONFIGURATION
# =====================================================

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true


# eMudhra Digital Signature Certificate

ekyc.signing.certificate=certificates/eMudhra.pfx
ekyc.signing.password=emudhra
ekyc.signing.reason=eKYC Document Approval