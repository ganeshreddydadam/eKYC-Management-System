<!DOCTYPE html>

<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Customer Registration</title>


    <style>

        * {
            box-sizing: border-box;
        }


        body {

            margin: 0;

            padding: 0;

            font-family: Arial, Helvetica, sans-serif;

            background: #eef5fb;

            color: #222;
        }


        .container {

            width: 850px;

            max-width: 95%;

            margin: 30px auto;

            background: white;

            padding: 35px 40px;

            border-radius: 10px;

            box-shadow:
                0 5px 20px rgba(0, 0, 0, 0.12);
        }


        h1 {

            text-align: center;

            color: #1f5a8a;

            margin-bottom: 30px;

            font-size: 38px;
        }


        h2 {

            color: #1f5a8a;

            font-size: 28px;

            margin-top: 30px;

            margin-bottom: 20px;

            border-bottom: 1px solid #ddd;

            padding-bottom: 10px;
        }


        .form-group {

            margin-bottom: 18px;
        }


        label {

            display: block;

            font-weight: bold;

            margin-bottom: 7px;

            font-size: 16px;
        }


        .required {

            color: red;
        }


        input,

        select,

        textarea {

            width: 100%;

            padding: 13px 14px;

            border: 1px solid #cfcfcf;

            border-radius: 6px;

            font-size: 16px;

            background: white;
        }


        input:focus,

        select:focus,

        textarea:focus {

            outline: none;

            border-color: #1f6fbd;

            box-shadow:
                0 0 4px rgba(31, 111, 189, 0.25);
        }


        textarea {

            height: 90px;

            resize: vertical;
        }


        /* =====================================================
           ERROR MESSAGE
           ===================================================== */

        .error {

            background: #ffe5e5;

            color: #b30000;

            border: 1px solid #ff9999;

            padding: 14px 16px;

            border-radius: 6px;

            margin-bottom: 25px;

            font-size: 15px;

            font-weight: bold;
        }


        /* =====================================================
           SUCCESS MESSAGE
           ===================================================== */

        .success {

            background: #e6f7e6;

            color: #087a08;

            border: 1px solid #8bd48b;

            padding: 14px 16px;

            border-radius: 6px;

            margin-bottom: 25px;

            font-size: 15px;

            font-weight: bold;
        }


        /* =====================================================
           SUBMIT BUTTON
           ===================================================== */

        .submit-btn {

            width: 100%;

            padding: 15px;

            margin-top: 20px;

            background: #1f6fbd;

            color: white;

            border: none;

            border-radius: 6px;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;
        }


        .submit-btn:hover {

            background: #155a9c;
        }


        .submit-btn:active {

            transform: scale(0.99);
        }


        /* =====================================================
           BACK BUTTON
           ===================================================== */

        .back-btn {

            display: block;

            text-align: center;

            margin-top: 18px;

            color: #1f6fbd;

            text-decoration: none;

            font-size: 16px;
        }


        .back-btn:hover {

            text-decoration: underline;
        }


        /* =====================================================
           REQUIRED FIELD NOTE
           ===================================================== */

        .required-note {

            font-size: 14px;

            color: #666;

            margin-bottom: 20px;
        }


        /* =====================================================
           RESPONSIVE
           ===================================================== */

        @media (max-width: 700px) {

            .container {

                padding: 25px 20px;
            }


            h1 {

                font-size: 30px;
            }


            h2 {

                font-size: 23px;
            }

        }

    </style>

</head>


<body>


<div class="container">


    <!-- =====================================================
         PAGE TITLE
         ===================================================== -->

    <h1>

        Customer Registration

    </h1>


    <div class="required-note">

        Fields marked with <span class="required">*</span> are required.

    </div>


    <!-- =====================================================
         ERROR MESSAGE
         ===================================================== -->

    <div

        th:if="${error}"

        class="error"

        th:text="${error}">

    </div>


    <!-- =====================================================
         SUCCESS MESSAGE
         ===================================================== -->

    <div

        th:if="${message}"

        class="success"

        th:text="${message}">

    </div>


    <!-- =====================================================
         REGISTRATION FORM
         IMPORTANT:
         Controller uses POST /register
         ===================================================== -->

    <form

        action="/register"

        method="post">


        <!-- =================================================
             PERSONAL INFORMATION
             ================================================= -->

        <h2>

            Personal Information

        </h2>


        <!-- FULL NAME -->

        <div class="form-group">

            <label>

                Full Name

                <span class="required">*</span>

            </label>

            <input

                type="text"

                name="fullName"

                placeholder="Enter full name"

                th:value="${param.fullName}"

                required>

        </div>


        <!-- FATHER'S NAME -->

        <div class="form-group">

            <label>

                Father's Name

            </label>

            <input

                type="text"

                name="fatherName"

                placeholder="Enter father's name"

                th:value="${param.fatherName}">

        </div>


        <!-- DATE OF BIRTH -->

        <div class="form-group">

            <label>

                Date of Birth

            </label>

            <input

                type="date"

                name="dateOfBirth"

                th:value="${param.dateOfBirth}">

        </div>


        <!-- GENDER -->

        <div class="form-group">

            <label>

                Gender

            </label>

            <select name="gender">

                <option value="">

                    Select Gender

                </option>

                <option

                    value="MALE"

                    th:selected="${param.gender != null and param.gender[0] == 'MALE'}">

                    Male

                </option>

                <option

                    value="FEMALE"

                    th:selected="${param.gender != null and param.gender[0] == 'FEMALE'}">

                    Female

                </option>

                <option

                    value="OTHER"

                    th:selected="${param.gender != null and param.gender[0] == 'OTHER'}">

                    Other

                </option>

            </select>

        </div>


        <!-- =================================================
             CONTACT INFORMATION
             ================================================= -->

        <h2>

            Contact Information

        </h2>


        <!-- MOBILE -->

        <div class="form-group">

            <label>

                Mobile Number

                <span class="required">*</span>

            </label>

            <input

                type="text"

                name="mobile"

                placeholder="Enter 10-digit mobile number"

                maxlength="10"

                pattern="[0-9]{10}"

                th:value="${param.mobile}"

                required>

        </div>


        <!-- EMAIL -->

        <div class="form-group">

            <label>

                Email Address

                <span class="required">*</span>

            </label>

            <input

                type="email"

                name="email"

                placeholder="Enter email address"

                th:value="${param.email}"

                required>

        </div>


        <!-- =================================================
             ADDRESS INFORMATION
             ================================================= -->

        <h2>

            Address Information

        </h2>


        <!-- ADDRESS -->

        <div class="form-group">

            <label>

                Address

            </label>

            <textarea

                name="address"

                placeholder="Enter complete address"

                th:text="${param.address}">

            </textarea>

        </div>


        <!-- CITY -->

        <div class="form-group">

            <label>

                City

            </label>

            <input

                type="text"

                name="city"

                placeholder="Enter city"

                th:value="${param.city}">

        </div>


        <!-- STATE -->

        <div class="form-group">

            <label>

                State

            </label>

            <input

                type="text"

                name="state"

                placeholder="Enter state"

                th:value="${param.state}">

        </div>


        <!-- PINCODE -->

        <div class="form-group">

            <label>

                Pincode

            </label>

            <input

                type="text"

                name="pincode"

                placeholder="Enter 6-digit pincode"

                maxlength="6"

                pattern="[0-9]{6}"

                th:value="${param.pincode}">

        </div>


        <!-- =================================================
             KYC INFORMATION
             ================================================= -->

        <h2>

            KYC Information

        </h2>


        <!-- AADHAAR -->

        <div class="form-group">

            <label>

                Aadhaar Number

            </label>

            <input

                type="text"

                name="aadhaarNumber"

                placeholder="Enter 12-digit Aadhaar number"

                maxlength="12"

                pattern="[0-9]{12}"

                th:value="${param.aadhaarNumber}">

        </div>


        <!-- PAN -->

        <div class="form-group">

            <label>

                PAN Number

            </label>

            <input

                type="text"

                name="panNumber"

                placeholder="Enter PAN number"

                maxlength="10"

                pattern="[A-Za-z]{5}[0-9]{4}[A-Za-z]{1}"

                style="text-transform: uppercase;"

                th:value="${param.panNumber}">

        </div>


        <!-- =================================================
             SUBMIT BUTTON
             ================================================= -->

        <button

            type="submit"

            class="submit-btn">

            Submit Registration

        </button>


        <!-- =================================================
             BACK TO HOME
             ================================================= -->

        <a

            href="/"

            class="back-btn">

            Back to Home

        </a>


    </form>


</div>


</body>

</html>
